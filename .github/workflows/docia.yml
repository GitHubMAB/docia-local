name: DocIA CI / CT

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # éval de nuit : détecte une dérive sans changement de code
  workflow_dispatch:
    inputs:
      provider:
        description: "Fournisseur LLM"
        type: choice
        options: [ollama, gemini]
        default: ollama
      model:
        description: "Modèle (vide = modèle par défaut du fournisseur)"
        default: ""

permissions:
  contents: read

concurrency:
  group: docia-${{ github.ref }}
  cancel-in-progress: true

env:
  # Par défaut (push, PR, nuit) : Gemini si le secret existe, sinon Ollama (aucune clé nécessaire).
  LLM_PROVIDER: ${{ inputs.provider || (secrets.GEMINI_API_KEY != '' && 'gemini' || 'ollama') }}
  LLM_MODEL: ${{ inputs.model }}

jobs:
  tests:
    name: CI - tests des règles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  eval:
    name: CT - évaluation LLM
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_samples.py

      - name: Démarrer Ollama (modèle local sur le runner)
        if: env.LLM_PROVIDER == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          ollama pull "${LLM_MODEL:-qwen2.5:3b}"

      - name: Évaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Fournisseur : $LLM_PROVIDER"
          python eval.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docia-results
          path: results/

  publish:
    name: Dashboard - publier l'historique
    needs: eval
    # Même si l'éval échoue : un échec doit apparaître dans l'historique. Pas pour les PR.
    if: always() && needs.eval.result != 'skipped' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # pousser sur la branche gh-pages
    concurrency:
      group: docia-pages  # deux runs ne publient jamais en même temps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docia-results
          path: results/
        continue-on-error: true
      - name: Mettre à jour l'historique et publier sur gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f results/metrics.json ]; then echo "Pas de métriques à publier"; exit 0; fi
          mkdir site && cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages; then git checkout -q gh-pages; else git checkout -q --orphan gh-pages; fi
          cd ..
          python dashboard/update_history.py results/metrics.json site/data/history.json
          cp dashboard/index.html site/index.html
          touch site/.nojekyll
          cd site
          git add -A
          git commit -q -m "Run ${GITHUB_RUN_ID} : métriques DocIA" || { echo "Rien de nouveau"; exit 0; }
          git push -q origin gh-pages
          echo "Dashboard : https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_STEP_SUMMARY"
